name: Daily aviation report

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC 18:00 = JST 3:00 起動（実際は2〜3.5時間遅れて動く）。メールは取得後すぐ送信（朝5〜7時ごろ着）
    # ※ Resend の予約送信（scheduled_at）は全件 Failed になったため不使用（2026-10-17）
    - cron: "0 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/cache のキーは一度保存すると同じキーには二度と書き込めない（save は黙って失敗する）。
      # 以前は固定キーだったため 2026-07-17 の状態から更新されず、同じ記事が毎回「新着」扱いになっていた。
      # 保存キーに毎回ユニークな run_id を含め、復元は restore-keys のプレフィックス一致で最新を拾う。
      # （プレフィックスを "-" なしにしているのは、移行初回に旧固定キーのキャッシュも拾うため）
      - name: Restore RSS notify snapshot
        id: cache-notify
        uses: actions/cache/restore@v4
        with:
          path: notify_state.json
          key: notify-rss-snapshot-v1-${{ github.run_id }}
          restore-keys: |
            notify-rss-snapshot-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 航空会社ニュース → メーカー/eVTOL → お得情報 → HTML → 新着メール（任意）
      - name: Fetch, render, notify
        env:
          OUT_DIR: public
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
        run: |
          set -e
          python fetcher.py && python industry_fetcher.py && python deals_fetcher.py && python renderer.py
          python notify_email.py || echo "::warning::notify_email failed (see log)"

      - name: Save RSS notify snapshot
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: notify_state.json
          key: notify-rss-snapshot-v1-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
